name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write # création de la release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Archive du kit
        run: |
          set -euo pipefail
          git archive --format=zip --prefix="claude-code-en-equipe-${GITHUB_REF_NAME}/" -o "claude-code-en-equipe-${GITHUB_REF_NAME}.zip" HEAD
          sha256sum "claude-code-en-equipe-${GITHUB_REF_NAME}.zip" > SHA256SUMS
      - uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        with:
          generate_release_notes: true
          files: |
            claude-code-en-equipe-*.zip
            SHA256SUMS
