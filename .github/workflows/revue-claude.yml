name: Revue Claude

# Revue automatique et NON bloquante : un commentaire sur la PR, jamais un check requis.
# Secret requis : ANTHROPIC_API_KEY (Settings > Secrets and variables > Actions).
# Alternative sans clé Anthropic : Bedrock ou Vertex via OIDC (use_bedrock / use_vertex) ; il faut
# alors ajouter « id-token: write » aux permissions du job, voir docs/cloud-providers.md de l'action.
# Config non fiable : sur une PR, l'action restaure elle-même .claude/, .mcp.json et CLAUDE.md
# depuis la branche de base avant de lancer Claude (docs/security.md de l'action) ; les hooks
# et permissions de la branche de la PR ne s'exécutent donc pas.
on:
  pull_request:
    types: [opened, synchronize, ready_for_review]

permissions:
  contents: read

concurrency:
  group: revue-claude-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  revue:
    # Les PR de forks n'ont pas accès aux secrets : on ne lance rien.
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      !github.event.pull_request.draft
    runs-on: ubuntu-latest
    timeout-minutes: 15
    continue-on-error: true
    permissions:
      contents: read
      pull-requests: write
      # id-token: write # uniquement pour Bedrock ou Vertex via OIDC
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      # L'action ne fournit pas le diff à Claude (README et docs/security.md de claude-code-action) :
      # on le calcule ici, hors de la session, pour ne lui laisser aucune commande Bash.
      - name: Diff de la PR
        env:
          BASE_REF: ${{ github.base_ref }}
        # .revue/ est créé après le checkout, exclu de git (.gitignore et .git/info/exclude) :
        # il n'apparaît jamais dans un commit, même si Claude ou une étape ultérieure fait git add.
        run: |
          mkdir -p "$GITHUB_WORKSPACE/.revue"
          echo ".revue/" >> "$GITHUB_WORKSPACE/.git/info/exclude"
          git diff "origin/${BASE_REF}...HEAD" > "$GITHUB_WORKSPACE/.revue/pr.diff"
      - uses: anthropics/claude-code-action@acfe7992852970efb4fee683d63d628e3e52df67 # v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          allow_fork_prs: "false"
          use_sticky_comment: "true"
          prompt: |
            REPO: ${{ github.repository }}
            PR: #${{ github.event.pull_request.number }}

            Relis cette pull request en suivant CLAUDE.md. Si .claude/agents existe,
            délègue la relecture sécurité à l'agent concerné ; applique aussi la skill
            revue-securite pour tout ce qui touche à l'authentification, aux
            autorisations, aux requêtes en base, aux entrées utilisateur et aux secrets.
            Signale bugs, failles, tests manquants et écarts aux conventions.
            Réponds en français, de façon concise, classé par gravité.
            Tu ne modifies aucun fichier : tu commentes uniquement.
            Le diff complet de la PR est dans .revue/pr.diff : lis-le avec Read.
          # Aucune commande Bash autorisée : git diff/log acceptent des options qui exécutent
          # un programme (--ext-diff, --output, -c core.pager…).
          claude_args: |
            --max-turns 8
            --allowedTools "Read,Grep,Glob,mcp__github_inline_comment__create_inline_comment"
