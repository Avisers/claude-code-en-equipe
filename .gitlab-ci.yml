# Équivalent GitLab de .github/workflows/verif.yml et revue-claude.yml.
#
# SECRETS DE LA REVUE IA — à lire avant d'activer le job revue-claude.
# Quiconque peut pousser une branche peut modifier CE fichier sur sa branche : un job qui reçoit
# ANTHROPIC_API_KEY depuis une définition de pipeline modifiable par l'auteur de la MR permet de
# l'exfiltrer (echo, curl). Conception standard, trois protections cumulées :
#   1. ANTHROPIC_API_KEY et GITLAB_TOKEN : « masquées », NON protégées (une MR vient d'une branche
#      non protégée, qui ne recevrait jamais une variable protégée), et limitées à la portée
#      d'environnement « revue-ia » : seuls les jobs qui déclarent cet environnement les reçoivent.
#   2. L'environnement « revue-ia » est protégé (Settings > CI/CD > Protected environments) et exige
#      l'approbation d'un mainteneur avant tout déploiement : un job qui s'y rattache attend ce feu
#      vert, et l'approbateur voit quel pipeline le demande.
#   3. Le job est imposé de l'extérieur, hors de portée de l'auteur de la MR : pipeline execution
#      policy (security policy project du groupe), ou ci_config_path vers un projet de conformité
#      (Settings > CI/CD > General pipelines > CI/CD configuration file =
#      « .gitlab-ci.yml@groupe/conformite-ci »). Exemple de fichier dans groupe/conformite-ci :
#        include:
#          - project: $CI_PROJECT_PATH     # jobs ordinaires du projet (verif)
#            ref: $CI_COMMIT_SHA
#            file: .gitlab-ci.yml
#          - project: groupe/conformite-ci # job de revue, modifiable par la seule équipe conformité
#            file: revue-claude.yml
#      Le job revue-claude ci-dessous sert de modèle à déplacer dans ce projet de conformité ;
#      retirez-le alors de ce fichier.
# GITLAB_TOKEN : project access token (pas un jeton personnel), rôle Reporter, scope « api »
# (seul scope qui permet de poster une note de MR), expiration courte, limité à ce projet.
# Ne lui donnez ni rôle Maintainer ni scope write_repository : la revue ne pousse rien.
stages: [verif, revue]

workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

default:
  image: ubuntu:24.04
  interruptible: true
  timeout: 10m

variables:
  GITLEAKS_VERSION: "8.18.4"
  GITLEAKS_SHA256: "ba6dbb656933921c775ee5a2d1c13a91046e7952e9d919f9bac4cec61d628e7d"
  GIT_DEPTH: "0"
  DEBIAN_FRONTEND: noninteractive

secrets:
  stage: verif
  before_script: [apt-get update -qq, apt-get install -y -qq curl git ca-certificates]
  script:
    - archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
    - curl -sSfL -o "$archive" "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/$archive"
    - echo "${GITLEAKS_SHA256}  $archive" | sha256sum -c -
    - tar -xzf "$archive" gitleaks
    - git config --global --add safe.directory "$CI_PROJECT_DIR"
    - ./gitleaks detect --source . --redact --verbose

scripts:
  stage: verif
  before_script: [apt-get update -qq, apt-get install -y -qq shellcheck bats]
  script:
    - shellcheck .claude/hooks/*.sh
    - |
      if ls tests/*.bats >/dev/null 2>&1; then bats tests/; else echo "Pas de tests bats, étape ignorée."; fi

formats:
  stage: verif
  before_script: [apt-get update -qq, apt-get install -y -qq jq git python3 python3-yaml nodejs npm]
  script:
    - git ls-files -z '*.json' '.*.json' | xargs -0 -n1 jq empty
    - python3 .github/scripts/frontmatter.py
    - npx --yes markdownlint-cli2@0.17.2 "**/*.md" "#node_modules"

revue-claude:
  stage: revue
  allow_failure: true # commentaire non bloquant
  interruptible: true
  timeout: 15m
  # Environnement protégé avec approbation : seul ce job reçoit les variables « revue-ia ».
  environment:
    name: revue-ia
    deployment_tier: other
  variables:
    GIT_DEPTH: "50"
  rules:
    # Pas de revue sur les MR issues de forks (le secret n'y est pas exposé) ni sur les brouillons.
    - if: >-
        $CI_PIPELINE_SOURCE == "merge_request_event" &&
        $CI_MERGE_REQUEST_SOURCE_PROJECT_ID == $CI_PROJECT_ID &&
        $CI_MERGE_REQUEST_TITLE !~ /^(Draft:|\[Draft\]|Draft\s)/i
  before_script:
    - apt-get update -qq && apt-get install -y -qq curl git jq ca-certificates nodejs npm
    # Version épinglée : une mise à jour se fait par MR, après lecture du changelog.
    - npm install -g @anthropic-ai/claude-code@2.1.330
  script:
    - git fetch origin "$CI_MERGE_REQUEST_TARGET_BRANCH_NAME" --depth=50
    - git diff "origin/${CI_MERGE_REQUEST_TARGET_BRANCH_NAME}...HEAD" > "$CI_PROJECT_DIR/mr.diff"
    - |
      # La branche source est non fiable : ses hooks, permissions et serveurs MCP ne doivent pas
      # s'exécuter. --setting-sources user ignore .claude/settings*.json du dépôt ; on restaure
      # en plus .claude/, .mcp.json et CLAUDE.md depuis la branche cible (agents, skills, consignes).
      for p in .claude .mcp.json CLAUDE.md; do
        rm -rf -- "$p"
        git checkout "origin/${CI_MERGE_REQUEST_TARGET_BRANCH_NAME}" -- "$p" 2>/dev/null || true
      done
      claude -p --setting-sources user "Relis ce diff de merge request en suivant CLAUDE.md. Délègue la relecture sécurité à l'agent concerné s'il existe dans .claude/agents. Signale bugs, failles, tests manquants, écarts aux conventions. Réponds en français, concis, classé par gravité. Tu ne modifies aucun fichier. Diff : mr.diff" \
        --allowedTools "Read,Grep,Glob" --max-turns 8 > /tmp/revue.md
    - |
      jq -Rs '{body: ("## Revue Claude (non bloquante)\n\n" + .)}' /tmp/revue.md > /tmp/note.json
      curl -sSf --request POST --header "PRIVATE-TOKEN: ${GITLAB_TOKEN}" --header "Content-Type: application/json" \
        --data @/tmp/note.json \
        "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/merge_requests/${CI_MERGE_REQUEST_IID}/notes"
